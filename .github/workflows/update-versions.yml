name: Update Image Versions

# Polls the curated upstreams in .github/upstreams.json. GitHub cannot trigger
# a workflow here directly from another repo's release, so this runs on a
# schedule (the same model bioconda/bots use) and opens a VERSION-bump PR per
# image shortly after any tracked upstream publishes a newer release.
on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check upstream releases and VERSIONs without opening PRs"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-versions
  cancel-in-progress: false

jobs:
  update:
    name: Bump upstream image versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run version bump
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          args=()
          if [[ "${DRY_RUN}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python3 .github/scripts/update_versions.py "${args[@]}"
